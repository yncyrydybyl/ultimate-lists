apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marcade.fullname" . }}
  labels:
    {{- include "marcade.labels" . | nindent 4 }}
  annotations:
    # OpenShift ImageChange trigger: resolve the ImageStream tag to an immutable
    # digest and rewrite the container image on every successful build, so
    # `oc rollout undo` lands on a concrete historical digest (see ADR-0001).
    image.openshift.io/triggers: |-
      [{"from":{"kind":"ImageStreamTag","name":"{{ include "marcade.fullname" . }}:{{ .Values.image.tag }}"},"fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "marcade.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marcade.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
