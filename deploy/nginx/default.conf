# nginx config for the ultimate-lists Matrix widget.
#
# Follows the marcade nginx pattern: brotli/gzip-precompressed hashed assets
# with content negotiation via a map (the alpine base has no ngx_brotli, so we
# pick a precompressed sibling instead of compressing at request time), a long
# immutable cache on hashed assets, no-cache on the shell, an SPA fallback that
# still returns a real 404 under /assets/, and /healthz for probes.
#
# Widget-specific: this page is loaded inside an iframe by a Matrix client, so
# it must NOT send X-Frame-Options (which cannot express an allowlist and would
# break embedding outright). Framing is controlled by CSP frame-ancestors.

# Brotli is preferred; listed first so it wins when a client accepts both.
map $http_accept_encoding $ul_accepts_br {
    default    "";
    "~*\bbr\b" "1";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens     off;

    gzip_static on;

    # connect-src used to be 'none': all syncing went over postMessage, which
    # CSP does not govern, so the page needed no network egress at all. Syncing
    # live updates over MatrixRTC changes that - the widget must reach the
    # homeserver's livekit-jwt-service over https and the LiveKit SFU over wss.
    # Neither host is known at build time (the SFU URL comes back with the
    # token), so this is broad. It is the security cost of the RTC transport;
    # narrow it to the specific homeserver and SFU once those are fixed.
    #
    # frame-ancestors is deliberately wide: Element Desktop is an Electron app
    # that frames widgets from `vector://vector`, a non-special scheme that
    # cannot be expressed as an https allowlist entry. Restricting this to a
    # list of https origins locks the desktop client out entirely.
    #
    # To lock the widget down to specific *web* clients (and give up desktop
    # support), replace `frame-ancestors *` with an explicit origin list here
    # AND set VITE_ALLOWED_CLIENT_ORIGINS at build time - both have to allow a
    # client for it to work.
    #
    # style-src-attr allows inline styles because Svelte's `style:` directive
    # writes through element.style, which Chrome reports as an inline-style
    # application. Tag colours are still injection-safe: every colour is parsed
    # by the CSSOM in normalizeColor() before it reaches the DOM, so a value
    # carrying extra declarations is rejected rather than rendered.
    set $ul_csp "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: wss:; worker-src 'self' blob:; media-src 'self' blob:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; frame-ancestors *; upgrade-insecure-requests";

    add_header Content-Security-Policy   $ul_csp                 always;
    add_header Referrer-Policy           "no-referrer"           always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # deliberately no X-Frame-Options - it would block widget embedding

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Hashed, content-addressed build output: cache hard, negotiate encoding.
    location ^~ /assets/ {
        error_page 418 = @ul_brotli;
        if ($ul_accepts_br) { return 418; }

        add_header Content-Security-Policy $ul_csp                 always;
        add_header Referrer-Policy         "no-referrer"           always;
        add_header X-Content-Type-Options  "nosniff"               always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary          "Accept-Encoding"                     always;

        # a missing asset is a real 404, never the SPA shell
        try_files $uri =404;
    }

    # Brotli siblings live in a parallel tree under the same filenames, so the
    # MIME type is still derived correctly from the extension.
    location @ul_brotli {
        root /usr/share/nginx/html-br;

        add_header Content-Encoding        "br"                    always;
        add_header Content-Security-Policy $ul_csp                 always;
        add_header Referrer-Policy         "no-referrer"           always;
        add_header X-Content-Type-Options  "nosniff"               always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary          "Accept-Encoding"                     always;

        try_files $uri @ul_identity;
    }

    location @ul_identity {
        root /usr/share/nginx/html;

        add_header Content-Security-Policy $ul_csp                 always;
        add_header Referrer-Policy         "no-referrer"           always;
        add_header X-Content-Type-Options  "nosniff"               always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary          "Accept-Encoding"                     always;

        try_files $uri =404;
    }

    # The shell must stay revalidated so a security fix can actually roll out;
    # a widget pinned in a room state event cannot be patched if it is cached.
    location = /index.html {
        add_header Content-Security-Policy $ul_csp                 always;
        add_header Referrer-Policy         "no-referrer"           always;
        add_header X-Content-Type-Options  "nosniff"               always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
